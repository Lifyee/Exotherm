[project]
name = "exotherm"
version = "0.1.0"
description = "This is a file encryption system that uses AES-GCM encryption alongside argon2 key derivation."
readme = "README.md"
authors = [
    { name = "Lifyee", email = "noreply@example.invalid" }
]
requires-python = ">=3.14"
dependencies = [
    "argon2-cffi>=25.1.0",
    "cryptography>=50.0.2",
    "pyside6>=6.12.0",
]

[project.scripts]
exotherm = "exotherm.gui:launch_app"

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "auto-py-to-exe>=2.50.1",
    "pyinstaller>=6.22.3",
]
